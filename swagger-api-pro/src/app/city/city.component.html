
<div class=" mt-2">

    <div class="mb-4" *ngIf="cityCount !== null">
        <div class="col-md-3">
            <div class="card text-center shadow-sm ">
                <div class="card-body count">
                    <h5 class="card-title ">Total City</h5>
                    <h3 class="fw-bold ">{{ cityCount }}</h3>
                </div>
            </div>
        </div>
    </div>

  <div class="account-button">

    <!-- Add Form Button -->
    <div *ngIf="!showForm" class="mb-3">
      <button class="btn btn-primary" (click)="openForm()">Add City
        <i class="fa-solid fa-plus"></i>
      </button>
      
    </div>

  </div>
  <div class="card shadow-lg" *ngIf="showForm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">City</h4>
    </div>


    <div class="card-body">
      <form [formGroup]="cityForm" (ngSubmit)="onSubmit()">

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">City Name</label>
            <input type="text" class="form-control" formControlName="cityname" />
            <div class="text-danger" *ngIf="cityForm.get('cityname')?.touched && cityForm.get('cityname')?.invalid">
              City Name is required
            </div>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">State</label>
            <input type="text" class="form-control" formControlName="citystate" />
            <div class="text-danger" *ngIf="cityForm.get('citystate')?.touched && cityForm.get('citystate')?.invalid">
              State is required
            </div>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Country</label>
            <input type="text" class="form-control" formControlName="citycountry" />
            <div class="text-danger" *ngIf="cityForm.get('citycountry')?.touched && cityForm.get('citycountry')?.invalid">
              Country is required
            </div>
          </div>
        </div>

        <!-- Row 2: Created Date, Updated Date, Created By -->
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Created Date</label>
            <input type="date" class="form-control" formControlName="createddate" />
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Updated Date</label>
            <input type="date" class="form-control" formControlName="updateddate" />
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Created By</label>
            <input type="text" class="form-control" formControlName="createdby" />
            <div class="text-danger" *ngIf="cityForm.get('createdBy')?.touched && cityForm.get('createdBy')?.invalid">
              Created By is required
            </div>
          </div>
        </div>

        <!-- Row 3: Updated By -->
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Updated By</label>
            <input type="text" class="form-control" formControlName="updatedby" />
          </div>
        </div>


        <div class="d-flex justify-content-between">

            <!-- Submit Button -->
          <button type="submit" class="btn btn-success">Submit</button>

          <button type="button" class="btn btn-secondary" (click)="onCancel()">
              Cancel
          </button>


        </div>

        



    


        
        
        
        

        

       
          

        

        
       
      </form>
    </div>
  </div>


  <div class="card shadow-lg mt-2 pt-2 px-3  pb-2" *ngIf="!showForm">
    <dx-data-grid
    #dataGrid
    id="gridContainer"
    [dataSource]="cities"
    [showBorders]="true"
    [rowAlternationEnabled]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [remoteOperations]="false"
    width="100%"
    [allowColumnReordering]="true"
    [allowColumnResizing]="true"
    [columnAutoWidth]="true">

    <!-- Paging & Pager -->
    <dxo-paging [pageSize]="5"></dxo-paging>
    <dxo-pager
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[5, 10, 20]"
      [showInfo]="true"
      [showNavigationButtons]="true">
    </dxo-pager>

    <!-- Filters & Search --> 
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>
    <dxo-search-panel [visible]="true" placeholder="Search all columns..." [highlightCaseSensitive]="false"></dxo-search-panel>

    <dxo-column-chooser [enabled]="true" mode="select"></dxo-column-chooser>

    <!-- Columns --> 
    <dxi-column dataField="cityname" caption="City Name"></dxi-column>
    <dxi-column dataField="citystate" caption="state"></dxi-column>
    <dxi-column dataField="citycountry" caption="Country"></dxi-column>
    <dxi-column dataField="cityid" caption="City ID"></dxi-column>

    <dxi-column
      caption="Action"
      [allowSorting]="false"
      [allowFiltering]="false"
      alignment="center"
      [width]="160"
      cellTemplate="actionTemplate">
    </dxi-column>

    <div *dxTemplate=" let rowData of 'actionTemplate';let i = Index" >
      <div class="d-flex justify-content-center gap-2">

        <!-- View -->
       <dx-button
          icon="fas fa-eye"
          hint="View"
          stylingMode="text"
          type="normal"
          (onClick)="onView(rowData.data?.cityid)">
        </dx-button> 

        


        <!-- Edit -->
        <dx-button
          icon="edit"
          hint="Edit"
          stylingMode="text"
          type="default"
          (onClick)="onEdit(rowData.data.cityid)">
        </dx-button> 

        <!-- Delete -->
        <dx-button
          icon="trash"
          hint="Delete"
          stylingMode="text"
          type="danger"
          (onClick)="onDelete(rowData.data.cityid)">
        </dx-button> 

      </div>
    </div> 

    

  </dx-data-grid> 

  </div>
  

  

  

</div>
